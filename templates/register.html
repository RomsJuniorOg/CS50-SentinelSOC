{% extends "layout.html" %}

{% block title %}Register Analyst{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-7 col-lg-6 col-xl-5">
        <div class="card shadow-lg border-secondary">
            <div class="card-header text-center py-3 bg-darker border-bottom border-secondary">
                <i class="fa-solid fa-user-shield text-cyber-cyan fs-2 mb-2"></i>
                <h4 class="fw-bold mb-0 text-cyber-blue">Analyst Enrollment</h4>
                <p class="text-muted small mb-0">Create your SentinelSOC investigator profile</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="full_name" class="form-label text-muted small">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-id-card"></i></span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. Alice Johnson">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" value="{{ username or '' }}" required placeholder="Choose a unique username">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required placeholder="Minimum 8 characters">
                        </div>
                        <div class="form-text text-muted small">Must contain at least 8 characters with letters and numbers.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmation" class="form-label text-muted small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-shield"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="confirmation" name="confirmation" required placeholder="Confirm your password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-outline-cyan w-100 py-2 fw-semibold mt-2">
                        <i class="fa-solid fa-user-plus me-1"></i> Register Account
                    </button>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-darker border-top border-secondary small text-muted">
                Already registered? <a href="{{ url_for('login') }}" class="text-cyber-blue text-decoration-none">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
