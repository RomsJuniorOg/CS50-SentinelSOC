{% extends "layout.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-secondary">
            <div class="card-header text-center py-3 bg-darker border-bottom border-secondary">
                <i class="fa-solid fa-shield-halved text-cyber-cyan fs-2 mb-2"></i>
                <h4 class="fw-bold mb-0 text-cyber-blue">SentinelSOC</h4>
                <p class="text-muted small mb-0">Authorized Security Analyst Access</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter analyst username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required placeholder="Enter password">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-outline-cyan w-100 py-2 fw-semibold mt-2">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Portal
                    </button>
                </form>

                <div class="mt-4 p-3 rounded bg-dark border border-secondary small text-muted">
                    <div class="fw-semibold text-light mb-1"><i class="fa-solid fa-key me-1 text-cyber-cyan"></i> Demo Credentials:</div>
                    <div>&bull; Admin: <span class="font-monospace text-cyber-blue">admin</span> / <span class="font-monospace text-cyber-blue">Sentinel123!</span></div>
                    <div>&bull; Analyst: <span class="font-monospace text-cyber-blue">analyst</span> / <span class="font-monospace text-cyber-blue">Sentinel123!</span></div>
                </div>
            </div>
            <div class="card-footer text-center py-3 bg-darker border-top border-secondary small text-muted">
                Need an analyst account? <a href="{{ url_for('register') }}" class="text-cyber-blue text-decoration-none">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
