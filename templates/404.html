{% extends "layout.html" %}

{% block title %}404 - Resource Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5 py-5">
    <div class="col-md-6">
        <i class="fa-solid fa-triangle-exclamation fa-4x text-warning mb-3"></i>
        <h1 class="display-5 fw-bold text-cyber-blue font-monospace">404</h1>
        <h3 class="h4 text-light mb-3">Observable / Resource Not Located</h3>
        <p class="text-muted mb-4">The requested incident, IOC record, or endpoint could not be found within the SentinelSOC perimeter.</p>
        <a href="{{ url_for('index') }}" class="btn btn-outline-cyan">
            <i class="fa-solid fa-house me-1"></i> Return to Operations Dashboard
        </a>
    </div>
</div>
{% endblock %}
